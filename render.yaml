services:
  - type: web
    name: knowledge-engine
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r apps/api/requirements-lock.txt
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.2"
      - key: KNOWLEDGE_ENGINE_PERSISTENCE_MODE
        value: hosted
      - key: KNOWLEDGE_ENGINE_STORAGE_BUCKET
        value: knowledge-engine-artifacts
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
      - key: KNOWLEDGE_ENGINE_DATABASE_URL
        sync: false
      - key: KNOWLEDGE_ENGINE_WORKSPACE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: KNOWLEDGE_ENGINE_BETA_PASSWORD
        sync: false
      - key: KNOWLEDGE_ENGINE_SESSION_SECRET
        generateValue: true
      - key: KNOWLEDGE_ENGINE_PUBLIC_HOST
        fromService:
          name: knowledge-engine
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
